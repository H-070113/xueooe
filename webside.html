        /* ===== 主容器 ===== */
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fff9fb;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 12px 40px rgba(255, 150, 180, 0.20);
            padding: 30px 30px 40px;
            position: relative;
            overflow: hidden;
        }

        /* ===== 背景装饰 ===== */
        .container::before {
            content: '🌸';
            position: absolute;
            top: -20px;
            right: 20px;
            font-size: 80px;
            opacity: 0.12;
            transform: rotate(20deg);
            pointer-events: none;
        }
        .container::after {
            content: '✨';
            position: absolute;
            bottom: 40px;
            left: -10px;
            font-size: 60px;
            opacity: 0.10;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        /* ===== 标题 ===== */
        .site-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #e87a9a;
            letter-spacing: 4px;
            margin-bottom: 18px;
            text-shadow: 0 2px 12px rgba(232, 122, 154, 0.20);
            position: relative;
            z-index: 1;
        }
        .site-title span {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ===== 自我介绍区域 ===== */
        .profile {
            background: linear-gradient(145deg, #ffeef2, #ffe4ea);
            border-radius: 32px;
            padding: 28px 30px 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
            box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.8), 0 6px 20px rgba(255, 150, 180, 0.12);
            position: relative;
            z-index: 1;
        }

        .avatar {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ffd6e0;
            border: 4px solid #fff;
            box-shadow: 0 4px 16px rgba(232, 122, 154, 0.25);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
        }
        .avatar:hover {
            transform: scale(1.04);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar .default-emoji {
            font-size: 56px;
            line-height: 1;
            user-select: none;
        }

        .profile-info {
            flex: 1;
            min-width: 180px;
        }
        .profile-info .name {
            font-size: 26px;
            font-weight: 700;
            color: #c95a7a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .profile-info .name .badge {
            font-size: 14px;
            background: #ffb7c9;
            color: #fff;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 500;
        }
        .profile-info .bio {
            margin-top: 8px;
            font-size: 16px;
            color: #7a5a6a;
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.55);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
        }
        .profile-info .bio i {
            font-style: normal;
            display: inline-block;
            animation: sparkle 2s infinite;
        }
        @keyframes sparkle {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* ===== 分隔装饰 ===== */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 16px 0 20px;
            color: #dba6b8;
            font-weight: 500;
            letter-spacing: 2px;
        }
        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, #fbc8d6, transparent);
        }

        /* ===== 分组照片区域 ===== */
        .groups-wrapper {
            display: flex;
            flex-direction: column;
            gap: 28px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .group-card {
            background: #fffbfc;
            border-radius: 28px;
            padding: 20px 22px 24px;
            box-shadow: 0 4px 16px rgba(255, 180, 200, 0.12);
            border: 1px solid rgba(255, 200, 215, 0.30);
            transition: 0.3s;
        }
        .group-card:hover {
            box-shadow: 0 6px 24px rgba(255, 160, 190, 0.18);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .group-header h3 {
            font-size: 20px;
            color: #c95a7a;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .group-header h3 .count {
            font-size: 14px;
            font-weight: 400;
            color: #dba6b8;
            background: #fcecf0;
            padding: 0 12px;
            border-radius: 20px;
        }

        .upload-btn {
            background: #ffb7c9;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(255, 150, 180, 0.25);
        }
        .upload-btn:hover {
            background: #f5a0b6;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 150, 180, 0.30);
        }
        .upload-btn:active {
            transform: scale(0.96);
        }
        .upload-btn input[type="file"] {
            display: none;
        }

        /* 照片网格 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            min-height: 80px;
        }

        .photo-item {
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: #fcecf0;
            box-shadow: 0 2px 10px rgba(200, 150, 165, 0.10);
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .photo-item:hover {
            transform: scale(1.02);
            border-color: #ffb7c9;
            box-shadow: 0 6px 20px rgba(255, 150, 180, 0.20);
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-item .delete-photo {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            color: #e0607a;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.25s;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .photo-item:hover .delete-photo {
            opacity: 1;
        }
        .photo-item .delete-photo:hover {
            background: #ff6b8a;
            color: #fff;
            transform: scale(1.1);
        }

        .empty-photo-hint {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 10px;
            color: #dba6b8;
            font-size: 15px;
            background: #fdf5f7;
            border-radius: 18px;
            border: 2px dashed #fad5e0;
            min-height: 100px;
        }
        .empty-photo-hint span {
            font-size: 32px;
            margin-bottom: 6px;
        }

        /* ===== 留言板 ===== */
        .message-board {
            background: #fffbfc;
            border-radius: 28px;
            padding: 22px 24px 28px;
            box-shadow: 0 4px 16px rgba(255, 180, 200, 0.10);
            border: 1px solid rgba(255, 200, 215, 0.25);
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .message-board .board-title {
            font-size: 22px;
            font-weight: 600;
            color: #c95a7a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .message-board .board-title small {
            font-size: 14px;
            font-weight: 400;
            color: #dba6b8;
        }

        .message-list {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
            padding-right: 4px;
        }
        .message-list::-webkit-scrollbar {
            width: 4px;
        }
        .message-list::-webkit-scrollbar-track {
            background: #fcecf0;
            border-radius: 10px;
        }
        .message-list::-webkit-scrollbar-thumb {
            background: #ffb7c9;
            border-radius: 10px;
        }

        .message-item {
            background: #fdf5f7;
            border-radius: 18px;
            padding: 14px 18px;
            border-left: 4px solid #ffb7c9;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message-item .msg-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .message-item .msg-name {
            font-weight: 600;
            color: #c95a7a;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .message-item .msg-name .avatar-mini {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffd6e0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .message-item .msg-time {
            font-size: 12px;
            color: #dba6b8;
        }
        .message-item .msg-delete {
            font-size: 12px;
            color: #e0607a;
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 8px;
            border-radius: 12px;
            transition: 0.2s;
            font-family: inherit;
        }
        .message-item .msg-delete:hover {
            background: #ffd6e0;
            color: #c94a6a;
        }
        .message-item .msg-content {
            font-size: 15px;
            color: #4a2e3f;
            line-height: 1.6;
            word-break: break-word;
            padding-left: 4px;
        }

        .empty-msg-hint {
            color: #dba6b8;
            text-align: center;
            padding: 20px 0;
            font-size: 15px;
        }

        /* 留言输入 */
        .msg-input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        .msg-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .msg-input-row input,
        .msg-input-row textarea {
            flex: 1;
            min-width: 140px;
            padding: 12px 18px;
            border: 2px solid #fad5e0;
            border-radius: 30px;
            font-size: 14px;
            background: #fffbfc;
            transition: 0.25s;
            outline: none;
            font-family: inherit;
            color: #4a2e3f;
        }
        .msg-input-row input:focus,
        .msg-input-row textarea:focus {
            border-color: #ffb7c9;
            box-shadow: 0 0 0 4px rgba(255, 183, 201, 0.15);
        }
        .msg-input-row textarea {
            min-height: 64px;
            resize: vertical;
            border-radius: 20px;
        }
        .msg-input-row input {
            flex: 0 0 180px;
        }
        .msg-submit-btn {
            align-self: flex-end;
            background: #ffb7c9;
            border: none;
            color: #fff;
            padding: 12px 36px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 2px 12px rgba(255, 150, 180, 0.20);
            margin-top: 2px;
        }
        .msg-submit-btn:hover {
            background: #f5a0b6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 150, 180, 0.30);
        }
        .msg-submit-btn:active {
            transform: scale(0.96);
        }

        /* ===== 灯箱 ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 10, 20, 0.70);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 30px;
        }
        .lightbox.show {
            display: flex;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.30);
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .lightbox .close-lb {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.25s;
            background: rgba(0, 0, 0, 0.2);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .lightbox .close-lb:hover {
            opacity: 1;
            transform: rotate(90deg);
            background: rgba(0, 0, 0, 0.35);
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: #dba6b8;
            letter-spacing: 1px;
            border-top: 1px solid #fcecf0;
            padding-top: 20px;
            position: relative;
            z-index: 1;
        }
        .footer .hearts {
            display: inline-block;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 18px 14px 28px;
                border-radius: 28px;
            }
            .profile {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px 16px;
                gap: 14px;
            }
            .profile-info .name {
                justify-content: center;
                font-size: 22px;
            }
            .profile-info .bio {
                font-size: 14px;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .group-card {
                padding: 14px 14px 18px;
            }
            .message-board {
                padding: 16px 14px 20px;
            }
            .msg-input-row input {
                flex: 1 1 100%;
            }
            .msg-input-row textarea {
                min-height: 56px;
            }
            .msg-submit-btn {
                width: 100%;
                justify-content: center;
            }
            .site-title {
                font-size: 22px;
            }
            .lightbox .close-lb {
                top: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 28px;
            }
        }

        @media (max-width: 400px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .group-header h3 {
                font-size: 17px;
            }
            .upload-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
    </style>
</head>

            // 默认数据
            function getDefaultData() {
                return {
                    profile: {
                        avatar: DEFAULT_AVATAR, // base64 或 null
                    },
                    groups: DEFAULT_GROUPS.map(g => ({
                        ...g,
                        photos: (DEFAULT_PHOTOS[g.id] || []).slice(),
                    })),
                    seeded: true,
                    messages: [],
                };
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        // 只保留 DEFAULT_GROUPS 中定义的分组，移除多余的分组
                        const defaultIds = DEFAULT_GROUPS.map(g => g.id);
                        data.groups = DEFAULT_GROUPS.map(def => {
                            const existing = data.groups.find(g => g.id === def.id);
                            const photos = existing && Array.isArray(existing.photos)
                                ? existing.photos
                                : (DEFAULT_PHOTOS[def.id] || []).slice();
                            return { ...def, photos: photos };
                        });
                        // 保证 profile 字段（没有头像时用内置头像）
                        if (!data.profile) data.profile = { avatar: DEFAULT_AVATAR };
                        else if (!data.profile.avatar) data.profile.avatar = DEFAULT_AVATAR;

                        // 旧版手机缓存可能已经标记过 seeded，但照片分组全是空的。
                        // 用版本号做一次迁移，不覆盖后来由用户主动保留的照片状态。
                        let savedSeedVersion = 0;
                        try {
                            savedSeedVersion = Number(localStorage.getItem(SEED_VERSION_KEY)) || 0;
                        } catch (_) { /* storage can be unavailable */ }
                        if (savedSeedVersion < DEFAULT_SEED_VERSION) {
                            data.groups.forEach(g => {
                                const builtInPhotos = DEFAULT_PHOTOS[g.id];
                                if ((!Array.isArray(g.photos) || g.photos.length === 0) && builtInPhotos?.length) {
                                    g.photos = builtInPhotos.slice();
                                }
                            });
                            try {
                                data.seeded = true;
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                                localStorage.setItem(SEED_VERSION_KEY, String(DEFAULT_SEED_VERSION));
                            } catch (_) { /* retry the migration on the next visit */ }
                        }
                        return data;
                    }
                } catch (_) { /* ignore */ }
                try {
                    localStorage.setItem(SEED_VERSION_KEY, String(DEFAULT_SEED_VERSION));
                } catch (_) { /* storage can be unavailable */ }
                return getDefaultData();
            }

            function saveData(data) {
                try {
                    data.seeded = true;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    alert('💾 存储空间不足！图片太大无法保存，请选择小一些的图片（每张建议不超过 1MB）。');
                }
            }

            // =============================================================
            //  2. 状态
            // =============================================================
            let appData = loadData();

            // =============================================================
            //  3. DOM 引用
            // =============================================================
            const groupsWrapper = document.getElementById('groupsWrapper');
            const messageList = document.getElementById('messageList');
            const msgCount = document.getElementById('msgCount');
            const msgName = document.getElementById('msgName');
            const msgContent = document.getElementById('msgContent');
            const msgSubmitBtn = document.getElementById('msgSubmitBtn');
            const bioText = document.getElementById('bioText');
            const avatarEmoji = document.getElementById('avatarEmoji');
            const avatarImg = document.getElementById('avatarImg');
            const avatarUpload = document.getElementById('avatarUpload');
            const avatarFileInput = document.getElementById('avatarFileInput');
            const lightbox = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImg');
            const closeLb = document.getElementById('closeLb');

            // =============================================================
            //  4. 渲染函数
            // =============================================================

            // 4.1 渲染自我介绍（固定文本，不读取存储以免被旧数据污染）
            function renderProfile() {
                bioText.textContent = '一位热爱生活的小仙女，但心情完全取决于游戏的输赢';

                const avatar = appData.profile.avatar;
                if (avatar && avatar.startsWith('data:image')) {
                    avatarImg.src = avatar;
                    avatarImg.style.display = 'block';
                    avatarEmoji.style.display = 'none';
                } else {
                    avatarImg.style.display = 'none';
                    avatarEmoji.style.display = 'block';
                }
            }

            // 4.2 渲染照片分组
            function renderGroups() {
                let html = '';
                for (const group of appData.groups) {
                    const photos = group.photos || [];
                    const count = photos.length;
                    html += `
                        <div class="group-card" data-group-id="${group.id}">
                            <div class="group-header">
                                <h3>
                                    ${group.emoji || '📷'} ${group.name}
                                    <span class="count">${count} 张</span>
                                </h3>
                                <button class="upload-btn" data-group-id="${group.id}">
                                    📤 上传照片（最多3张）
                                    <input type="file" accept="image/*" multiple />
                                </button>
                            </div>
                            <div class="photo-grid" data-group-id="${group.id}">
                    `;
                    if (count === 0) {
                        html += `
                            <div class="empty-photo-hint">
                                <span>🖼️</span>
                                还没有照片呢，点击「上传照片」添加吧（最多3张）~
                            </div>
                        `;
                    } else {
                        for (let i = 0; i < photos.length; i++) {
                            const src = photos[i];
                            html += `
                                <div class="photo-item" data-index="${i}" data-group-id="${group.id}">
                                    <img src="${src}" alt="照片" decoding="async" />
                                    <button class="delete-photo" data-index="${i}" data-group-id="${group.id}" title="删除">✕</button>
                                </div>
                            `;
                        }
                    }
                    html += `
                            </div>
                        </div>
                    `;
                }
                groupsWrapper.innerHTML = html;

                // 绑定上传按钮
                document.querySelectorAll('.upload-btn').forEach(btn => {
                    const fileInput = btn.querySelector('input[type="file"]');
                    const groupId = btn.dataset.groupId;
                    btn.addEventListener('click', (e) => {
                        if (e.target.tagName !== 'INPUT') {
                            fileInput.click();
                        }
                    });
                    fileInput.addEventListener('change', (e) => {
                        const files = Array.from(e.target.files);
                        if (files.length === 0) return;
                        handleUploadPhotos(groupId, files);
                        fileInput.value = ''; // 重置
                    });
                });

                // 绑定删除照片
                document.querySelectorAll('.delete-photo').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const groupId = btn.dataset.groupId;
                        const index = parseInt(btn.dataset.index, 10);
                        deletePhoto(groupId, index);
                    });
                });

                // 绑定点击查看大图
                document.querySelectorAll('.photo-item img').forEach(img => {
                    img.addEventListener('click', () => {
                        const src = img.getAttribute('src');
                        if (src) openLightbox(src);
                    });
                });
            }

            // 4.3 渲染留言板
            function renderMessages() {
                const messages = appData.messages || [];
                msgCount.textContent = `(${messages.length} 条)`;

                if (messages.length === 0) {
                    messageList.innerHTML = `
                        <div class="empty-msg-hint">
                            💭 还没有留言，快来写下第一句温暖吧 ~
                        </div>
                    `;
                    return;
                }

                // 按时间降序
                const sorted = [...messages].reverse();
                let html = '';
                for (const msg of sorted) {
                    const time = msg.time || '刚刚';
                    const name = msg.name || '匿名小可爱';
                    const content = msg.content || '';
                    html += `
                        <div class="message-item" data-msg-time="${escapeHtml(time)}" data-msg-name="${escapeHtml(name)}" data-msg-content="${escapeHtml(content)}">
                            <div class="msg-head">
                                <span class="msg-name">
                                    <span class="avatar-mini">${getAvatarEmoji(name)}</span>
                                    ${escapeHtml(name)}
                                </span>
                                <span class="msg-time">${escapeHtml(time)}</span>
                                <button class="msg-delete" title="删除留言">✕</button>
                            </div>
                            <div class="msg-content">${escapeHtml(content)}</div>
                        </div>
                    `;
                }
                messageList.innerHTML = html;
                // 绑定删除留言按钮
                messageList.querySelectorAll('.msg-delete').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const item = btn.closest('.message-item');
                        const time = item.dataset.msgTime;
                        const name = item.dataset.msgName;
                        const content = item.dataset.msgContent;
                        if (confirm('确定删除这条留言吗？')) {
                            deleteMessage(time, name, content);
                        }
                    });
                });
                // 滚动到最新
                messageList.scrollTop = 0;
            }

            // 辅助：根据名字生成头像 emoji
            function getAvatarEmoji(name) {
                const emojis = ['🌸', '🐱', '🦊', '🐰', '🐼', '🐨', '🦄', '🌈', '⭐', '🌻', '🍀', '🎀', '💖', '✨', '🧸'];
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                return emojis[Math.abs(hash) % emojis.length];
            }

            // 简单防 XSS
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // =============================================================
            //  5. 业务操作
            // =============================================================

            // 5.1 压缩图片（最大宽高 800px，转 JPEG 降低体积）
            function compressImage(dataUrl, maxSize = 800, quality = 0.8) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxSize || h > maxSize) {
                            const ratio = Math.min(maxSize / w, maxSize / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(dataUrl); // 失败则返回原图
                    img.src = dataUrl;
                });
            }

            // 5.2 上传照片（每组最多3张）
            async function handleUploadPhotos(groupId, files) {
                const group = appData.groups.find(g => g.id === groupId);
                if (!group) return;

                const remaining = 3 - group.photos.length;
                if (remaining <= 0) {
                    alert('📸 每个分组最多上传 3 张照片哦 ~');
                    return;
                }

                const validFiles = [];
                for (const file of files) {
                    if (!file.type.startsWith('image/')) continue;
                    if (validFiles.length >= remaining) break;
                    validFiles.push(file);
                }

                if (validFiles.length === 0) {
                    renderGroups();
                    return;
                }

                if (validFiles.length < files.length) {
                    alert(`📸 每个分组最多 3 张，已自动选取前 ${validFiles.length} 张 ~`);
                }

                for (const file of validFiles) {
                    const reader = new FileReader();
                    const base64 = await new Promise(resolve => {
                        reader.onload = e => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    const compressed = await compressImage(base64);
                    group.photos.push(compressed);
                }
                saveData(appData);
                renderGroups();
            }

            // 5.3 删除照片
            function deletePhoto(groupId, index) {
                const group = appData.groups.find(g => g.id === groupId);
                if (!group) return;
                if (index >= 0 && index < group.photos.length) {
                    group.photos.splice(index, 1);
                    saveData(appData);
                    renderGroups();
                }
            }

            // 5.4 添加留言
            function addMessage(name, content) {
                if (!content || content.trim() === '') {
                    alert('💌 写点内容再发送吧 ~');
                    return false;
                }
                const now = new Date();
                const timeStr =
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                appData.messages.push({
                    name: name.trim() || '匿名小可爱',
                    content: content.trim(),
                    time: timeStr,
                });
                saveData(appData);
                renderMessages();
                // 清空输入
                msgContent.value = '';
                if (!msgName.value.trim()) {
                    msgName.value = '';
                }
                return true;
            }

            // 5.5 删除留言
            function deleteMessage(time, name, content) {
                const index = appData.messages.findIndex(
                    m => m.time === time && m.name === name && m.content === content
                );
                if (index !== -1) {
                    appData.messages.splice(index, 1);
                    saveData(appData);
                    renderMessages();
                }
            }

            // 5.6 更新头像
            function updateAvatar(base64) {
                appData.profile.avatar = base64;
                saveData(appData);
                renderProfile();
            }

            // =============================================================
            //  6. 灯箱
            // =============================================================
            function openLightbox(src) {
                lbImg.src = src;
                lightbox.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('show');
                document.body.style.overflow = '';
            }

            closeLb.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeLightbox();
            });

            // =============================================================
            //  7. 事件绑定
            // =============================================================

            // 7.1 留言提交
            msgSubmitBtn.addEventListener('click', () => {
                const name = msgName.value.trim();
                const content = msgContent.value.trim();
                addMessage(name, content);
            });

            msgContent.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    msgSubmitBtn.click();
                }
            });

            // 7.2 头像上传
            avatarUpload.addEventListener('click', () => {
                avatarFileInput.click();
            });
            avatarFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const base64 = ev.target.result;
                    updateAvatar(base64);
                };
                reader.readAsDataURL(file);
                avatarFileInput.value = '';
            });

            // =============================================================
            //  8. 初始化渲染
            // =============================================================
            function init() {
                renderProfile();
                renderGroups();
                renderMessages();
                // 自动填充昵称（如果有存储）
                const savedName = localStorage.getItem('pink_visitor_name');
                if (savedName) msgName.value = savedName;
                // 保存昵称
                msgName.addEventListener('change', () => {
                    const val = msgName.value.trim();
                    if (val) localStorage.setItem('pink_visitor_name', val);
                });
            }

            init();

            // 暴露数据到控制台方便调试（可选）
            window.__appData = appData;

        })();
    </script>

</body>
</html>
